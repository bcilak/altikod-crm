services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saleshub
      POSTGRES_PASSWORD: saleshub_local_only
      POSTGRES_DB: saleshub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - saleshub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleshub -d saleshub"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  saleshub_pg:
