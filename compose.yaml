services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saleshub
      POSTGRES_PASSWORD: saleshub_local_only
      POSTGRES_DB: saleshub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - saleshub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleshub -d saleshub"]
      interval: 3s
      timeout: 3s
      retries: 20
  clamav:
    # Optional locally: `docker compose --profile scan up -d clamav`, then MALWARE_SCANNER=clamd and CLAMD_HOST=127.0.0.1 in .env.
    image: clamav/clamav:1.4
    profiles: ["scan"]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - saleshub_clamav:/var/lib/clamav
volumes:
  saleshub_pg:
  saleshub_clamav:
